/* Adventure (TEST, real 3D). The student's own character, built as a 3D cartoon figure from their saved look, walks a

   pollen, birds, other characters who pop up and cheer. Uses three.js (pinned 0.160.0, loaded from jsdelivr).
   Game rules as agreed: one stone = one skill in an existing game; forks let the student choose; "?" stones are
   surprises; the Golden Stone opens a bonus level; gates are real songs; stones crack into pebbles after 4 misses.
   Demo only: nothing is saved. Older versions: adventure-canvas.html (2.5D), adventure-2d.html (flat map). */
:root{color-scheme:light;--fg:#23231F;--muted:#6B6558;--line:#E8E1D2;--accent:#FFB805;

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#9fd3f0;color:var(--fg);font-family:var(--ui);font-size:16px;height:100dvh;position:relative;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;color:var(--fg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.top{display:flex;align-items:center;gap:8px}
.top a.back,.top button.snd{text-decoration:none;font-weight:800;font-size:14px;border:2px solid var(--fg);border-radius:999px;padding:4px 11px;background:#fff;color:var(--fg);white-space:nowrap}
.top h1{margin:0;font-family:var(--head);font-weight:900;font-size:22px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.top .test{background:var(--accent);border-radius:999px;padding:1px 8px;font-weight:800;font-size:11px;letter-spacing:.06em}
.top .where{margin-left:auto;background:rgba(255,255,255,.92);border:2px solid var(--fg);border-radius:12px;padding:3px 10px;font-family:var(--head);font-weight:900;font-size:14px;line-height:1.15;text-align:right}
.top .where small{display:block;font-family:var(--ui);font-weight:600;font-size:12px;color:var(--muted)}
.skills{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}

.sk i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}

.sk .pips b.on{background:var(--c)}
.sk.bump{animation:bump .6s}

.controls .go{background:var(--accent);min-width:150px}
.controls button[disabled]{opacity:.45}
.controls .choice{max-width:46vw;font-size:16px;line-height:1.1}

  ] },

      R: { name: "Chord Cliffs", s: "chords", stones: [
        { s: "chords", n: "Open Essentials", d: "A, E and Dm.", game: "chords.html", cracks: ["A", "E", "Dm"] },

const BONUS = { name: "Starlight Stage", theme: "stars", steps: [
  { s: "repertoire", n: "Spotlight 1", d: "Collect the floating note!", bonus: true },

  { s: "repertoire", n: "Encore!", d: "Last one! Then back to the adventure.", bonus: true, end: true }
] };
// sky top, horizon/fog, sun colour and strength, ambient sky and ground light
const THEMES = {
  meadow: { top: "#4fa6e8", hor: "#cfeefa", sun: "#fff3d6", sunI: 2.2, sky: "#bfe3ff", gnd: "#6b8f3a", fogN: 35, fogF: 150 },
  canyon: { top: "#e7894a", hor: "#ffe0b0", sun: "#ffd29a", sunI: 2.4, sky: "#ffd7a8", gnd: "#a8683a", fogN: 35, fogF: 160 },
  river:  { top: "#3d8fd6", hor: "#d3ecfb", sun: "#f4fbff", sunI: 2.0, sky: "#cde9ff", gnd: "#4f8a5a", fogN: 30, fogF: 140 },
  stars:  { top: "#0b0726", hor: "#3a2470", sun: "#9db0ff", sunI: 0.6, sky: "#5a4aa8", gnd: "#1a1030", fogN: 30, fogF: 120 }
};

/* ============================== the course ============================== */
const SP = 11;
function makeNode(o, extra){ return Object.assign({ type: "stone", done: false, fails: 0, cracked: false, pebbles: null }, o, extra); }
const forkOff = (f, z) => (z <= f.z0 || z >= f.z1) ? 0 : 5 * Math.sin(Math.PI * (z - f.z0) / (f.z1 - f.z0));
function buildCourse(regions, xfn){
  const steps = [makeNode({ type: "start", n: "Start" }, { z: 0, region: 0 })]; let z = SP;
  regions.forEach((r, ri) => {
    r.z0 = z - SP / 2;
    r.steps.forEach(st => {
      if(st.fork){
        const len = Math.max(st.fork.L.stones.length, st.fork.R.stones.length), fz0 = z - SP * 0.6, fz1 = z + SP * (len - 1) + SP * 0.6;
        const fork = { fork: true, z0: fz0, z1: fz1, region: ri, names: { L: st.fork.L.name, R: st.fork.R.name }, sk: { L: st.fork.L.s, R: st.fork.R.s } };
        ["L", "R"].forEach(b => fork[b] = st.fork[b].stones.map((s, k) => makeNode(s, { z: z + SP * k, region: ri, branch: b, fork })));
        steps.push(fork); z += SP * len;
      } else { steps.push(makeNode(st, { z, region: ri })); z += st.type === "gate" ? SP * 1.6 : SP; }
    });
    r.z1 = z - SP / 2;
  });
  const c = { steps, regions, xfn, len: z + 30, forks: steps.filter(s => s.fork) };
  const nx = n => n.branch ? xfn(n.z) + (n.branch === "L" ? -1 : 1) * forkOff(n.fork, n.z) : xfn(n.z);
  steps.forEach(s => s.fork ? ["L", "R"].forEach(b => s[b].forEach(n => n.x = nx(n))) : s.x = nx(s));
  return c;
}
const MAIN = buildCourse(REGIONS, z => 7 * Math.sin(z / 34) + 2.6 * Math.sin(z / 14 + 1));
const BONUSC = buildCourse([BONUS], z => 3.5 * Math.sin(z / 10));
let C = MAIN;
function regionAt(c, z){ const i = c.regions.findIndex(r => z < r.z1); return i < 0 ? c.regions.length - 1 : i; }
const themeNameAt = (c, z) => c.regions[regionAt(c, z)].theme;
function roadDist(c, x, z){
  let d = Math.abs(x - c.xfn(z));
  for(const f of c.forks) if(z > f.z0 - 1 && z < f.z1 + 1){ const o = forkOff(f, z), b = c.xfn(z); d = Math.min(Math.abs(x - b + o), Math.abs(x - b - o)); if(o < 1.6) d = Math.min(d, Math.abs(x - b)); }
  return d;
}

/* ============================== noise and terrain ============================== */
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function noise(x, y){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const fbm = (x, y) => noise(x, y) * 0.6 + noise(x * 2.1, y * 2.1) * 0.28 + noise(x * 4.3, y * 4.3) * 0.12;
const sstep = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function themeHeight(th, x, z, d){
  const near = sstep(2.2, 11, d), far = sstep(26, 70, d);
  if(th === "meadow") return near * (fbm(x * 0.05, z * 0.05) * 4.5 - 0.6) + far * fbm(x * 0.02 + 9, z * 0.02) * 22;
  if(th === "canyon"){ const m = fbm(x * 0.035 + 3, z * 0.035); const mesa = m > 0.58 ? sstep(0.58, 0.62, m) * 9 : 0;
    return near * (fbm(x * 0.07, z * 0.07) * 1.6 + mesa) + far * (10 + fbm(x * 0.03, z * 0.03) * 22); }
  if(th === "river"){ const bank = sstep(14, 24, d); return (1 - bank) * -2.2 * near + bank * (fbm(x * 0.06, z * 0.06) * 4 + 0.4) + far * fbm(x * 0.02, z * 0.02 + 5) * 26; }
  return -40;
}
// the road itself always stays flat at 0; regions blend into each other over 16 units
function heightAt(c, x, z){
  const d = roadDist(c, x, z), ri = regionAt(c, z), th = c.regions[ri].theme, r = c.regions[ri];
  const h1 = themeHeight(th, x, z, d); if(ri === 0) return h1;
  const prev = c.regions[ri - 1].theme; if(prev === th) return h1;
  const w = sstep(r.z0, r.z0 + 16, z); return themeHeight(prev, x, z, d) * (1 - w) + h1 * w;

  showSheet();
}
function dropPopper(n){ if(!n.popper) return; const p = n.popper; n.popper = null; const t0 = clock.elapsedTime; const sink = () => { const k = (clock.elapsedTime - t0) / 0.5; p.position.y = -2.4 * k; if(k < 1) requestAnimationFrame(sink); else scene.remove(p); }; sink(); }
function giveLoot(l){ ME[l.k] = l.v; if(l.k === "extra") ME.extraColor = l.c; else if(l.k === "acc") ME.accColor = l.c; else ME.gearColor = l.c; S.loot.push(l.n); rebuildMe(); cheer(); winSound(); }
function collectBonus(n){
  n.done = true; if(n.note) n.note.visible = false; burst(n.x, 2, n.z, "#ffc42b", 40); winSound(); cheer();
  toast("♪ Note collected!", n.end ? "Bonus stage complete!" : `${BONUSC.steps.filter(s => s.done).length} of ${BONUSC.steps.length - 1}`);
  if(n.end){ const l = LOOT[Math.floor(Math.random() * LOOT.length)]; setTimeout(() => { giveLoot(l); toast("Bonus prize!", `You won ${l.n}. Look at your character!`); }, 1300); setTimeout(leaveBonus, 3600); }
  else setTimeout(forward, 900);
}
function snapEnv(name){ const th = THEMES[name]; for(const key of ["top", "hor", "sun", "sky", "gnd"]) envNow[key].set(th[key]); envNow.sunI = th.sunI; envNow.fogN = th.fogN; envNow.fogF = th.fogF; skyU.night.value = name === "stars" ? 1 : 0; }
function swapWorld(bonus){ snapEnv(bonus ? "stars" : themeNameAt(MAIN, S.pz)); WORLD.main.visible = !bonus; WORLD.bonus.visible = bonus; life.npcs.forEach(n => { if(n.ch){ scene.remove(n.ch); n.ch = null; n.pop = 0; } }); }
function enterBonus(){
  hideSheet(); $("flash").classList.add("on");
  setTimeout(() => { S.saved = { i: S.i, b: S.b, k: S.k, lastBranch: S.lastBranch }; S.mode = "bonus"; C = BONUSC; BONUSC.steps.forEach(s => { s.done = false; if(s.note) s.note.visible = true; }); Object.assign(S, { i: 0, b: null, k: 0, peb: -1 });
    setAt(C.steps[0]); swapWorld(true); camera.position.copy(T(S.px, 3, S.pz - 6)); $("flash").classList.remove("on"); drawHud(); toast("🌟 Starlight Stage!", "Bonus level: collect every note."); setTimeout(forward, 1500); }, 380);
}
function leaveBonus(){
  $("flash").classList.add("on");
  setTimeout(() => { S.mode = "main"; C = MAIN; Object.assign(S, S.saved); const n = baseNode(); n.done = true; buildStone(n, WORLD.main); setAt(n); swapWorld(false);
    camera.position.copy(T(S.px, 3, S.pz - 6)); $("flash").classList.remove("on"); drawHud(); renderControls(); burst(n.x, 1.5, n.z, "#ffc42b"); }, 380);
}

/* ============================== the stone card ============================== */
function $(id){ return document.getElementById(id); }
let pic = null;
function showSheet(){
  const n = node(), sh = $("sheet"), ri = n.region;
  if(pic){ pic.destroy(); pic = null; }
  let kind, title, body = n.d || "", btns = "", who = ME;
  if(n.type === "surprise"){
    const ev = n.event;
    if(n.done){ kind = "Surprise"; title = "Already found!"; body = "You've had this surprise. Keep exploring."; btns = `<button class="go" data-a="close">Keep going</button>`; }
    else if(ev.kind === "quiz"){ kind = "Surprise challenge"; title = `${ev.who} jumps out!`; who = ev.cfg; body = `“Answer this and I'll give you something cool: <b>${ev.q.q}</b>”`;
      btns = ev.opts.map((o, j) => `<button data-a="ans" data-j="${j}">${o.t}</button>`).join(""); }
    else { kind = "Surprise"; title = "A treasure chest!"; body = `Inside: <b>${ev.loot.n}</b>.`; btns = `<button class="go" data-a="chest">🎁 Open it and wear it</button>`; }
  } else if(n.type === "golden"){
    kind = "Bonus level"; title = "The Golden Stone"; body = n.done ? "You've played the Starlight Stage. Nice!" : "It hums with music… Step in to visit the <b>Starlight Stage</b> bonus level?";
    btns = n.done ? `<button class="go" data-a="close">Keep going</button>` : `<button class="go" data-a="bonus">🌟 Enter the bonus level</button><button data-a="close">Maybe later</button>`;
  } else {
    const sk = SKILLS[n.s], isGate = n.type === "gate", ready = !isGate || clearedIn(ri) >= REGIONS[ri].need;
    kind = sk.n + (isGate ? " · Gate boss" : n.optional ? " · Side quest" : n.pebble ? " · Pebble" : n.branch ? ` · ${n.fork.names[n.branch]}` : ""); title = n.n;
    if(n.cracked && !n.done) body = `This stone cracked into ${n.pebbles.length} pebbles. Clear them all and it counts. ` + n.pebbles.map((p, k) => `<button data-a="peb" data-k="${k}" style="margin:6px 4px 0 0;border:2px solid #26211f;border-radius:10px;background:${p.done ? "#c9f2b8" : "#fff"};padding:4px 10px;font-weight:800">${p.done ? "⭐ " : ""}${p.n}</button>`).join("");
    if(isGate && !ready) body += ` <b>Clear ${REGIONS[ri].need} stones in ${REGIONS[ri].name} first (${clearedIn(ri)} so far).</b>`;
    if(n.done) btns = `<button class="go" data-a="close">⭐ Cleared · keep exploring</button>`;
    else if(n.cracked) btns = `<button data-a="close">Close</button>`;
    else if(n.classOnly) btns = `<button class="go" data-a="pass">💎 Dave clears this in class (demo: clear it)</button>`;
    else if(isGate && !ready) btns = `<button class="go" data-a="close">OK</button>`;
    else btns = (n.game ? `<a href="${n.game}">▶ Play the game</a>` : "") + `<button class="go" data-a="pass">✓ Passed (demo)</button><button data-a="fail">✗ Not yet (demo)</button>`;
    if(!n.done && n.cracks && !n.cracked && n.fails) btns += `<div class="demo" style="flex-basis:100%;border:0;min-height:0">Tries: ${n.fails} of ${CRACK_AFTER}. After ${CRACK_AFTER}, this stone cracks into smaller ones.</div>`;
  }
  sh.innerHTML = `<button class="x" data-a="close" aria-label="Close">×</button><div class="row"><div class="pic" id="pic"></div><div><div class="kind">${kind}</div><h2>${title}</h2></div></div>
    <p>${body}</p><div class="btns">${btns}</div><div class="demo">TEST: demo buttons stand in for playing the real game. Nothing is saved.</div>`;
  pic = PlayerArt($("pic"), who, { tap: false }); setTimeout(() => pic && pic.moment(n.done ? "done" : "hello", 1600), 120);
  sh.classList.add("show");
}
function hideSheet(){ $("sheet").classList.remove("show"); }
$("sheet").addEventListener("click", e => {
  const a = e.target.closest("[data-a]"); if(!a) return; const n = node();
  switch(a.dataset.a){
    case "close": hideSheet(); dropPopper(n); break;
    case "pass": pass(); break;
    case "fail": fail(); break;
    case "bonus": enterBonus(); break;
    case "peb": toPebble(+a.dataset.k); break;
    case "chest": { const l = n.event.loot; giveLoot(l); n.done = true; hideSheet(); burst(S.px, 1.4, S.pz, "#ffc42b", 40); toast("🎁 You got " + l.n + "!", "Look: you're wearing it now."); drawHud(); break; }
    case "ans": { const o = n.event.opts[+a.dataset.j]; n.done = true; a.classList.add(o.ok ? "right" : "wrong");
      setTimeout(() => { hideSheet(); dropPopper(n);
        if(o.ok){ const l = LOOT[Math.floor(Math.random() * LOOT.length)]; giveLoot(l); burst(S.px, 1.4, S.pz, "#9be04a", 40); toast("Correct! " + n.event.who + " gives you " + l.n, "You're wearing it now."); }
        else toast("Good try!", `It was “${n.event.opts.find(x => x.ok).t}”. +1 effort point.`);
        drawHud(); }, 700); break; }
  }
});
function pass(){
  const n = node(), base = baseNode(); n.done = true; hideSheet(); burst(n.x, 1.2, n.z, (SKILLS[n.s] || SKILLS.repertoire).c); cheer(); winSound();
  buildStone(n, S.mode === "bonus" ? WORLD.bonus : WORLD.main, !!n.pebble);
  let msg = ["Stone cleared!", n.n];
  if(n.power && !S.powers.includes(n.power)){ S.powers.push(n.power); msg = ["New power!", POWERS[n.power]]; }
  if(S.peb >= 0 && base.pebbles.every(p => p.done)){ base.done = true; buildStone(base, WORLD.main); msg = ["The whole stone counts!", base.n]; }
  if(n.type === "gate"){ n.koT = performance.now(); S.region = Math.max(S.region, n.region + 1); burst(n.x, 2, n.z + 2, "#e8433f", 60);
    msg = ["Gate boss beaten!", REGIONS[n.region + 1] ? `On to ${REGIONS[n.region + 1].name}!` : "That's the end of the test map."]; }
  toast(msg[0], msg[1]); bump(n.s); drawHud(); renderControls();
}
function fail(){
  const n = node(); n.fails++; hideSheet();
  if(n.cracks && !n.cracked && n.fails >= CRACK_AFTER){
    n.cracked = true; n.pebbles = n.cracks.map((c, k, a) => makeNode({ n: c, s: n.s, d: `A smaller piece of “${n.n}”.`, game: n.game }, { pebble: true, region: n.region, z: n.z + 0.5, x: n.x + (k - (a.length - 1) / 2) * 1.8 }));
    buildStone(n, WORLD.main); n.pebbles.forEach(p => buildStone(p, WORLD.main, true));
    burst(n.x, 0.5, n.z, "#a9a29a", 30); toast("Crack!", `“${n.n}” split into ${n.pebbles.length} smaller stones.`);
  } else toast("Nice try!", n.cracks && !n.cracked ? `+1 effort point. Tries: ${n.fails} of ${CRACK_AFTER}.` : "+1 effort point. Every go counts.");
  setTimeout(showSheet, 1500);
}

/* ============================== HUD and controls ============================== */
function drawHud(){
  const tally = {}, total = {};
  MAIN.steps.forEach(st => (st.fork ? [...st.L, ...st.R] : [st]).forEach(n => { if(!n.s) return; total[n.s] = (total[n.s] || 0) + 1; if(n.done) tally[n.s] = (tally[n.s] || 0) + 1; }));
  $("skills").innerHTML = Object.entries(SKILLS).map(([k, s]) => `<div class="sk" data-s="${k}" style="--c:${s.c}"><i style="background:${s.c}22">${s.i}</i>${s.n}<span class="pips">${Array.from({ length: total[k] || 0 }, (_, j) => `<b class="${j < (tally[k] || 0) ? "on" : ""}"></b>`).join("")}</span></div>`).join("");
  $("powers").innerHTML = (S.powers.length ? "Powers: " + S.powers.map(p => `<span>${POWERS[p]}</span>`).join("") : "") + (S.loot.length ? ` Found: ${S.loot.map(l => `<span>${l}</span>`).join("")}` : "");
  if(S.mode === "bonus"){ $("where").innerHTML = `🌟 Starlight Stage<small>Bonus level</small>`; return; }
  const ri = baseNode().region || 0, r = REGIONS[ri], cl = clearedIn(ri);
  $("where").innerHTML = `${r.name}<small>${cl >= r.need ? "✓ Gate boss ready!" : `${cl} of ${r.need} stones for the gate`}</small>`;
}
function bump(s){ requestAnimationFrame(() => { const e = $("skills").querySelector(`[data-s="${s}"]`); if(e){ e.classList.remove("bump"); void e.offsetWidth; e.classList.add("bump"); } }); }
function renderControls(){
  const c = $("controls");
  if(S.choosing){ const f = S.choosing.fork;
    c.innerHTML = ["L", "R"].map(b => `<button class="choice" data-c="${b}">${b === "L" ? "⬅ " : ""}${SKILLS[f.sk[b]].i} ${f.names[b]}${b === "R" ? " ➡" : ""}<small>${SKILLS[f.sk[b]].n} stones</small></button>`).join("");
  } else c.innerHTML = `<button data-c="back" aria-label="Go back" ${S.moving ? "disabled" : ""}>◀</button><button class="go" data-c="go" ${S.moving ? "disabled" : ""}>▶ Walk on</button><button data-c="jump" aria-label="Jump">⤒</button>`;
}
$("controls").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if(!b) return; const k = b.dataset.c;
  if(k === "go") forward(); else if(k === "back") back(); else if(k === "jump") jump(); else choose(k); });
addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("#sheet button")) return;
  if(S.choosing){ if(e.key === "ArrowLeft") choose("L"); if(e.key === "ArrowRight") choose("R"); return; }
  if(e.key === "ArrowUp" || e.key === " " || e.key === "Enter"){ e.preventDefault(); forward(); }
  if(e.key === "ArrowDown"){ e.preventDefault(); back(); }
  if(e.key === "j" || e.key === "J") jump();
  if(e.key === "Escape") hideSheet();
});
canvas.addEventListener("pointerdown", e => { S.drag = { x: e.clientX, y: e.clientY, look: S.look, lookV: S.lookV, t: performance.now(), moved: false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => { if(!S.drag) return; const dx = e.clientX - S.drag.x, dy = e.clientY - S.drag.y; if(Math.abs(dx) + Math.abs(dy) > 6) S.drag.moved = true;
  S.look = Math.max(-1.3, Math.min(1.3, S.drag.look - dx * 0.006)); S.lookV = Math.max(-0.5, Math.min(0.9, S.drag.lookV + dy * 0.004)); });
canvas.addEventListener("pointerup", () => { const d = S.drag; S.drag = null; if(d && !d.moved && performance.now() - d.t < 300){ if($("sheet").classList.contains("show")) hideSheet(); else jump(); } });
$("snd").onclick = () => { if(audio.on){ audio.on = false; if(audio.wind) audio.wind.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.2); $("snd").textContent = "🔇"; } else { startAudio(); $("snd").textContent = "🔊"; } };
let toastT; function toast(a, b){ const t = $("toast"); t.innerHTML = a + (b ? `<small>${b}</small>` : ""); t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2000); }
function hint(on){ $("hint").style.opacity = on ? 1 : 0; }

/* ============================== start ============================== */
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 70 : 58; camera.updateProjectionMatrix(); }
addEventListener("resize", resize);
resize();
buildWorld(); rebuildMe(); setAt(C.steps[0]); camera.position.copy(T(S.px, 3.2, S.pz - 6.5));
drawHud(); renderControls();
requestAnimationFrame(frame);
setTimeout(() => $("loading").classList.add("gone"), 300);
setTimeout(() => toast(`Off you go${ME.name ? ", " + ME.name : ""}!`, "Walk on to the first stone."), 2800);
setTimeout(() => hint(false), 8000);
// for testing
window.__adv = { S, MAIN, BONUSC, forward, back, choose, pass, fail, node, baseNode, enterBonus, toPebble, camera, renderer, setTravel: f => { window.__travel = f; } };
</script>
</body>
</html>
