<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adventure · Forbes Music Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Adventure (TEST, 3D view): the student's own character walks away from the camera along a road of stepping stones.
   Drawn on one canvas with a tiny home-made 3D projection (no libraries): the road, the stones, scenery and the other
   characters are all placed in a 3D world and projected, far things first.
   One stone = one skill, played in a game that already exists. Regions end with a gate boss (a real song, so repertoire),
   the road forks so the student picks which skill to work on, "?" stones hold surprise challenges, and a golden stone
   opens a bonus stage. A stone that beats you 4 times cracks into smaller pebbles.
   Demo only: progress lives in memory and resets when the page reloads. The flat version is adventure-2d.html. */
:root{color-scheme:light;--bg:#EFEAD9;--fg:#23231F;--muted:#6B6558;--line:#E8E1D2;--accent:#FFB805;
  --head:'Nunito',ui-rounded,system-ui,sans-serif;--ui:'Work Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#222;color:var(--fg);font-family:var(--ui);font-size:16px;overflow:hidden;height:100dvh;position:relative;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;color:var(--fg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

.hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.top{display:flex;align-items:center;gap:8px}
.top a.back{text-decoration:none;font-weight:800;font-size:14px;border:2px solid var(--fg);border-radius:999px;padding:4px 11px;background:#fff;color:var(--fg);white-space:nowrap}
.top h1{margin:0;font-family:var(--head);font-weight:900;font-size:22px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.top .test{background:var(--accent);border-radius:999px;padding:1px 8px;font-weight:800;font-size:11px;letter-spacing:.06em}
.top .where{margin-left:auto;background:rgba(255,255,255,.92);border:2px solid var(--fg);border-radius:12px;padding:3px 10px;font-family:var(--head);font-weight:900;font-size:14px;line-height:1.15;text-align:right}
.top .where small{display:block;font-family:var(--ui);font-weight:600;font-size:12px;color:var(--muted)}
.skills{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.skills::-webkit-scrollbar{display:none}
.sk{flex:none;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);border:2px solid rgba(0,0,0,.08);border-radius:999px;padding:2px 9px 2px 3px;font-size:12px;font-weight:700}
.sk i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.sk .pips{display:flex;gap:2px}
.sk .pips b{width:6px;height:6px;border-radius:50%;background:var(--line)}
.sk .pips b.on{background:var(--c)}
.sk.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.18)}}
.powers{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.powers span{background:rgba(255,255,255,.92);color:var(--fg);border-radius:999px;padding:0 8px;text-shadow:none;border:2px solid var(--fg)}

.controls{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none;padding:0 12px}
.controls button{pointer-events:auto;min-height:56px;min-width:64px;border-radius:18px;border:3px solid var(--fg);background:#fff;font-weight:900;font-family:var(--head);font-size:18px;box-shadow:0 4px 0 var(--fg);padding:0 16px}
.controls button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fg)}
.controls .go{background:var(--accent);min-width:150px}
.controls button[disabled]{opacity:.45}
.controls .choice{background:#fff;max-width:46vw;font-size:16px;line-height:1.1}
.controls .choice small{display:block;font-family:var(--ui);font-weight:600;font-size:12px;color:var(--muted)}

#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(560px,100%);background:#fff;border:3px solid var(--fg);border-bottom:0;
  border-radius:22px 22px 0 0;padding:14px 16px max(16px,env(safe-area-inset-bottom));transition:transform .28s;z-index:10;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
#sheet.show{transform:translate(-50%,0)}
#sheet .row{display:flex;gap:12px;align-items:center}
#sheet .pic{width:76px;height:76px;flex:none;margin:-6px 0 -6px -6px}
#sheet .kind{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
#sheet h2{margin:2px 0 0;font-family:var(--head);font-weight:900;font-size:22px;line-height:1.1}
#sheet p{margin:10px 0 0;color:var(--muted);font-size:15px}
#sheet .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#sheet .btns > *{flex:1 1 140px;min-height:48px;border-radius:14px;border:2px solid var(--fg);background:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;padding:0 10px;color:var(--fg)}
#sheet .btns .go{background:var(--accent)}
#sheet .btns .right{background:#c9f2b8}
#sheet .btns .wrong{background:#ffd2cc}
#sheet .demo{margin-top:8px;font-size:12px;color:var(--muted);text-align:center}
#sheet .x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:24px;line-height:1;padding:6px;color:var(--muted)}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);background:#fff;border:3px solid var(--fg);border-radius:18px;padding:12px 20px;font-family:var(--head);font-weight:900;font-size:22px;
  text-align:center;z-index:20;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;box-shadow:0 5px 0 var(--fg)}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast small{display:block;font-family:var(--ui);font-weight:600;font-size:14px;color:var(--muted);margin-top:4px}
.hint{position:absolute;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px);transform:translateX(-50%);background:rgba(35,35,31,.8);color:#fff;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;z-index:4;transition:opacity .5s;white-space:nowrap;pointer-events:none}
.banner{position:absolute;left:50%;top:21%;transform:translate(-50%,-50%) scale(.4);font-family:var(--head);font-weight:900;font-size:clamp(28px,7vw,54px);color:#fff;text-align:center;z-index:12;pointer-events:none;opacity:0;transition:all .5s cubic-bezier(.2,1.6,.4,1);text-shadow:0 4px 0 #26211f,0 0 18px rgba(0,0,0,.25);-webkit-text-stroke:2px #26211f;white-space:nowrap}
.banner small{display:block;font-size:.38em;-webkit-text-stroke:0;text-shadow:0 2px 0 #26211f}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .35s}
.flash.on{opacity:1}
.top .pill{border:2px solid var(--fg);border-radius:999px;background:#fff;font-size:15px;padding:3px 9px;line-height:1.2}
#done{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,220,120,.55),rgba(30,20,40,.6));display:none;align-items:center;justify-content:center;z-index:26;padding:16px}
#done.show{display:flex;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#done .donecard{background:#fffdf6;border:3px solid var(--fg);border-radius:24px;padding:10px 18px 18px;width:min(380px,100%);text-align:center;box-shadow:0 6px 0 var(--fg)}
#donePic{width:190px;height:190px;margin:0 auto -6px}
#done h2{margin:0;font-family:var(--head);font-weight:900;font-size:26px;line-height:1.1}
#done p{margin:8px 0 14px;color:var(--muted);font-size:15px}
#done button{width:100%;min-height:54px;border-radius:16px;border:3px solid var(--fg);background:var(--accent);font-family:var(--head);font-weight:900;font-size:19px;box-shadow:0 4px 0 var(--fg)}
#map{position:fixed;inset:0;background:rgba(20,18,30,.55);display:none;align-items:center;justify-content:center;z-index:25;padding:16px}
#map.show,#ward.show{display:flex}
#intro{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;z-index:27;padding:12px 12px max(14px,env(safe-area-inset-bottom))}
#intro.show{display:flex;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
#intro .introcard{display:flex;gap:12px;align-items:flex-end;background:#fffdf6;border:3px solid var(--fg);border-radius:22px;padding:12px 14px;width:min(520px,100%);box-shadow:0 6px 0 var(--fg)}
#intro img{width:92px;height:92px;flex:none;margin:-34px 0 -6px -6px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#intro b{font-family:var(--head);font-weight:900;font-size:20px}
#intro p{margin:4px 0 10px;font-size:15px;color:var(--muted)}
#intro button{min-height:46px;padding:0 18px;border-radius:14px;border:3px solid var(--fg);background:var(--accent);font-family:var(--head);font-weight:900;font-size:17px;box-shadow:0 3px 0 var(--fg)}
#ward{position:fixed;inset:0;background:rgba(20,18,30,.55);display:none;align-items:center;justify-content:center;z-index:25;padding:16px}
#ward h2{margin:0 0 4px;font-family:var(--head);font-weight:900;font-size:22px}
#ward p{margin:8px 0 0;font-size:13px;color:var(--muted);text-align:center}
#ward .x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:26px;color:var(--muted)}
.wardlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.wardlist button{border:2px solid var(--fg);border-radius:12px;background:#fff;padding:6px 10px;font-weight:800;font-size:14px}
.wardlist button.on{background:var(--accent)}
#map .mapcard,#ward .mapcard{position:relative;background:#fffdf6;border:3px solid var(--fg);border-radius:22px;padding:14px 16px 12px;width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 6px 0 var(--fg)}
#map h2{margin:0 0 8px;font-family:var(--head);font-weight:900;font-size:22px}
#map canvas{position:static;inset:auto;display:block;width:100%;height:min(66vh,560px);border-radius:14px;border:2px solid var(--fg);background:#cfeefa}
#map p{margin:8px 0 0;font-size:13px;color:var(--muted);text-align:center}
#map .x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:26px;color:var(--muted)}
@media (max-width:520px){ .top h1,.top .test{display:none} .top .where{font-size:13px;padding:3px 8px} .top .where small{font-size:11px} .controls .go{min-width:120px} #sheet h2{font-size:20px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="top">
    <a class="back" href="./">← Games</a>
    <button class="pill" id="snd" aria-label="Sound on or off">🔇</button>
    <button class="pill" id="mapBtn" aria-label="Map">🗺️</button>
    <button class="pill" id="wardBtn" aria-label="Wardrobe">👕</button>
    <h1>Adventure</h1><span class="test">TEST</span>
    <div class="where" id="where"></div>
  </div>
  <div class="skills" id="skills"></div>
  <div class="powers" id="powers"></div>
</div>
<div class="hint" id="hint">Tap ▶ (or Space / ↑) to walk · ↓ to go back · J to jump</div>
<script>if(matchMedia("(pointer: coarse)").matches) document.getElementById("hint").textContent = "Tap ▶ to walk · drag to look around · tap to jump";</script>
<div class="controls" id="controls"></div>
<div id="sheet" role="dialog" aria-live="polite"></div>
<div class="toast" id="toast"></div>
<div id="done" role="dialog" aria-label="Region complete"><div class="donecard"><div id="donePic"></div><h2 id="doneT"></h2><p id="doneP"></p><button id="doneGo"></button></div></div>
<div id="intro" role="dialog" aria-label="Welcome"><div class="introcard"><img src="characters/plucky.png" alt="Plucky"><div><b id="introT"></b><p id="introP"></p><button id="introGo"></button></div></div></div>
<div id="ward" role="dialog" aria-label="Wardrobe"><div class="mapcard"><button class="x" id="wardX" aria-label="Close">×</button><h2>Your wardrobe</h2><div id="wardPic" style="width:150px;height:150px;margin:0 auto"></div><div id="wardList" class="wardlist"></div><p>Things you find on the adventure go here. Pick what to wear.</p></div></div>
<div id="map" role="dialog" aria-label="Map of your adventure"><div class="mapcard"><button class="x" id="mapX" aria-label="Close">×</button><h2>Your adventure</h2><canvas id="mapCv"></canvas><p id="mapNote"></p><p><button id="mapReset" style="border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:12px">Start the adventure again</button></p></div></div>
<div class="flash" id="flash"></div>
<div class="banner" id="banner"></div>

<script src="fma-student.js?v=4"></script>
<script src="player-art.js?v=25"></script>
<script>
/* ============================== the content (would come from path.json) ============================== */
const SKILLS = {
  fretboard:  { n: "Fretboard",  i: "🎯", c: "#4aa8ff" },
  chords:     { n: "Chords",     i: "🎸", c: "#ff8a1c" },
  rhythm:     { n: "Rhythm",     i: "🥁", c: "#4fb86a" },
  lead:       { n: "Lead",       i: "⚡", c: "#e8433f" },
  theory:     { n: "Theory",     i: "📖", c: "#a070e8" },
  creativity: { n: "Creativity", i: "🎨", c: "#ff6fa3" },
  repertoire: { n: "Repertoire", i: "🎵", c: "#d9a400" }
};
const POWERS = { echo: "🔊 Echo", root: "🎯 Root Only", slow: "🐢 Slow-Mo", wind: "💨 Second Wind" };
const CRACK_AFTER = 4;
// Things you can win, all visible from behind (so you see them on your character straight away).
const LOOT = [
  { k: "extra", v: "cape", n: "a hero cape", c: "#e8433f" }, { k: "extra", v: "wings", n: "a pair of wings", c: "#f7f4ee" },
  { k: "extra", v: "backpack", n: "an adventure backpack", c: "#4fb86a" }, { k: "acc", v: "crown", n: "a golden crown", c: "#ffc42b" },
  { k: "acc", v: "party", n: "a party hat", c: "#ff6fa3" }, { k: "acc", v: "phones", n: "big headphones", c: "#3a3a3d" },
  { k: "acc", v: "cat", n: "cat ears", c: "#3a3a3d" }, { k: "acc", v: "halo", n: "a halo", c: "#ffd34d" },
  { k: "gear", v: "flyingv", n: "a Flying V", c: "#a070e8" }, { k: "acc", v: "beanie", n: "a cosy beanie", c: "#4aa8ff" }
];
const QUIZ = [
  { q: "How many strings does a standard guitar have?", a: ["6", "4", "5", "7"] },
  { q: "Which string is the thickest?", a: ["Low E", "A", "G", "High e"] },
  { q: "On a TAB line, what does the number tell you?", a: ["Which fret", "Which finger", "How loud", "How long"] },
  { q: "How many beats are in one bar of 4/4?", a: ["4", "2", "3", "8"] },
  { q: "Which of these is a minor chord?", a: ["Am", "G", "C", "D"] },
  { q: "What do you call playing one note at a time?", a: ["Lead", "Strumming", "Tuning", "Chording"] },
  { q: "Which open string is between A and G?", a: ["D", "E", "B", "C"] }
];
const NPC_NAMES = ["Busker Bea", "Riff Rory", "Strummy Sam", "Jazz Jo", "Tempo Tia", "Captain Capo", "DJ Dex", "Melody Mae", "Fret Fred", "Loopy Lou", "Amp Annie", "Bongo Ben"];
const CHEERS = ["Go go go!", "You've got this!", "Nice hat!", "Rock on!", "Keep strumming!", "Woo!", "Looking sharp!", "Practise makes progress!", "See you at the gig!", "That riff tho!"];

// A region = a run of steps. A step is a stone, or a fork with two branches of stones.
// type: stone | surprise | golden (bonus stage) | gate. "need" = cleared stones needed to challenge the gate.
const REGIONS = [
  { name: "Open Strings Meadow", theme: "meadow", need: 4, steps: [
    { s: "fretboard", n: "Six Strings, Six Names", d: "Name the six open strings by playing them.", game: "quiz.html", power: "echo" },
    { s: "fretboard", n: "Tune Up!", d: "Tune all six strings. Race your own best time.", game: "tuner.html" },
    { type: "surprise" },
    { s: "chords", n: "First Chord: Em", d: "Play every note of E minor until it rings.", game: "chords.html", power: "root" },
    { fork: { L: { name: "Rhythm Ridge", s: "rhythm", stones: [
        { s: "rhythm", n: "Solid Ground", d: "Rhythm Level 1: quarter notes and rests. Cleared in class with Dave.", classOnly: true },
        { s: "rhythm", n: "Clap It Back", d: "Hear a rhythm, clap it back. Cleared in class.", classOnly: true } ] },
      R: { name: "Riff Lane", s: "lead", stones: [
        { s: "lead", n: "First Riff", d: "Play a short riff note by note.", game: "songs.html", cracks: ["Bars 1–2", "Bars 3–4"] },
        { s: "lead", n: "Low E Warm-Up", d: "Single notes on the low E string.", game: "songs.html" } ] } } },
    { s: "chords", n: "Two-Chord Friends", d: "Em to Am and back, without stopping.", game: "chords.html", cracks: ["Just Em", "Just Am", "Em → Am, slow"] },
    { type: "golden" },
    { s: "theory", n: "Read the Lines", d: "What TAB is: which string, which fret.", game: "songs.html" },
    { s: "creativity", n: "Jam Spot", d: "Make up a 3-note riff on the open strings and play it for someone at home. Optional.", optional: true },
    { type: "gate", s: "repertoire", n: "The Grumpy Amp", d: "Boss Battle: Zombie (Em C G D), slow, root notes. Beat it to open Chord Canyon.", game: "boss.html", power: "slow", boss: "amp" }
  ] },
  { name: "Chord Canyon", theme: "canyon", need: 4, steps: [
    { s: "chords", n: "First Chords Family", d: "Em, Am, G, C and D.", game: "chords.html", cracks: ["Em Am G", "C and D"] },
    { s: "fretboard", n: "Natural Notes", d: "Find any natural note (no sharps or flats).", game: "quiz.html", power: "wind" },
    { type: "surprise" },
    { fork: { L: { name: "Theory Tunnel", s: "theory", stones: [
        { s: "theory", n: "Why Em and G Are Friends", d: "Spot the notes two chords share." },
        { s: "theory", n: "Major vs Minor", d: "Hear the difference: happy or sad?" } ] },
      R: { name: "Chord Cliffs", s: "chords", stones: [
        { s: "chords", n: "Open Essentials", d: "A, E and Dm.", game: "chords.html", cracks: ["A", "E", "Dm"] },
        { s: "chords", n: "Sevenths", d: "E7, A7 and D7.", game: "chords.html" } ] } } },
    { s: "rhythm", n: "Keep It Moving", d: "Rhythm Level 2: adding eighth notes. Cleared in class.", classOnly: true },
    { type: "surprise" },
    { s: "lead", n: "Two-String Riff", d: "A riff that crosses two strings.", game: "songs.html" },
    { s: "creativity", n: "Write a Loop", d: "Pick any 4 chords you know and make your own loop. Optional.", optional: true },
    { type: "gate", s: "repertoire", n: "Tangled Cables", d: "Boss Battle: Wagon Wheel (G D Em C), slow, whole chords.", game: "boss.html", boss: "cables" }
  ] },
  { name: "Riff River", theme: "river", need: 4, steps: [
    { s: "fretboard", n: "All Twelve Notes", d: "Sharps and flats too.", game: "quiz.html" },
    { type: "surprise" },
    { s: "lead", n: "Riff River Run", d: "A longer riff.", game: "songs.html" },
    { s: "chords", n: "Open Colours", d: "Cmaj7, Em7, Dsus2…", game: "chords.html" },
    { s: "rhythm", n: "Big & Small", d: "Rhythm Level 3.", classOnly: true },
    { s: "creativity", n: "Answer the Riff", d: "Call and response. Optional.", optional: true },
    { type: "gate", s: "repertoire", n: "The Feedback Beast", d: "Boss Battle: Stand By Me. (End of the test map.)", game: "boss.html", boss: "amp" }
  ] }
];
const BONUS = { name: "Starlight Stage", theme: "stars", steps: [
  { s: "repertoire", n: "Spotlight 1", d: "Collect the floating note!", bonus: true },
  { s: "repertoire", n: "Spotlight 2", d: "Collect the floating note!", bonus: true },
  { s: "repertoire", n: "Spotlight 3", d: "Collect the floating note!", bonus: true },
  { s: "repertoire", n: "Encore!", d: "Last one! Then back to the adventure.", bonus: true, end: true }
] };

const THEMES = {
  meadow: { sky: ["#7cc6f2", "#d8f0fb"], g1: "#8fd457", g2: "#82c94c", road: "#e2c08d", edge: "#c79f68", far: ["#8cc9a5", "#6fb08e"], fog: "#d8f0fb", props: ["tree", "tree", "bush", "flower", "flower", "rock", "mushroom", "pine", "fence"] },

// a wooden welcome arch over the road at the start of each region, with its name on a sign

  const found = LOOT.filter(l => S.loot.includes(l.n)), wearing = l => ME[l.k] === l.v;
  const hints = SECRETS.filter(sc => !S.loot.includes(sc.loot.n)).map(sc => `<span title="A secret" style="border:2px dashed #b9b0a0;border-radius:12px;padding:6px 10px;font-size:13px;color:var(--muted)">❓ a secret in ${regionName(sc.z)}</span>`).join("");
  $("wardList").innerHTML = hints + `<button data-w="base">My usual look</button>` + (found.length ? found.map((l, i) => `<button data-w="${LOOT.indexOf(l)}" class="${wearing(l) ? "on" : ""}">${l.n.replace(/^an? /, "")}</button>`).join("") : `<span style="color:var(--muted);font-size:14px">Nothing found yet: try the “?” stones!</span>`);
  if(wardPic) wardPic.destroy(); wardPic = PlayerArt($("wardPic"), ME, { tap: true }); $("ward").classList.add("show");
}
$("wardList").addEventListener("click", e => { const b = e.target.closest("[data-w]"); if(!b) return;
  if(b.dataset.w === "base") Object.assign(ME, BASE_LOOK); else { const l = LOOT[+b.dataset.w]; if(ME[l.k] === l.v) ME[l.k] = BASE_LOOK[l.k]; else { ME[l.k] = l.v; ME[l.k === "extra" ? "extraColor" : l.k === "acc" ? "accColor" : "gearColor"] = l.c; } }
  heroImages(); HERO.front = {}; saveGame(); openWard(); if(wardPic) setTimeout(() => wardPic && wardPic.moment("best", 1200), 100); });
$("wardBtn").onclick = openWard; $("wardX").onclick = () => { $("ward").classList.remove("show"); if(wardPic){ wardPic.destroy(); wardPic = null; } };
$("ward").addEventListener("click", e => { if(e.target.id === "ward") $("wardX").onclick(); });
// first visit: Plucky shows you round in three quick steps (once per player on this device)
const INTRO = [
  ["Hi, I'm Plucky!", "Welcome to the Adventure. Tap <b>▶ Walk on</b> to hop along the path, one stepping stone at a time.", "Next"],
  ["Every stone is a skill", "Fretboard, chords, rhythm, lead… Play the game on a stone to clear it. Stuck? It cracks into smaller stones, or use a power.", "Next"],
  ["Gates are songs", "Clear enough stones and you can take on the gate boss: a real song! Beat it to open the next region. Have fun!", "Let's go!"]];
const INTRO_KEY = () => window.fmaKey ? window.fmaKey("fma-adventure-intro-v1") : "fma-adventure-intro-v1";
let introStep = 0;
function showIntro(){ const [t, p, b] = INTRO[introStep]; $("introT").textContent = t; $("introP").innerHTML = p; $("introGo").textContent = b; $("intro").classList.add("show"); }
$("introGo").onclick = () => { introStep++; if(introStep < INTRO.length){ $("intro").classList.remove("show"); void $("intro").offsetWidth; showIntro(); } else { $("intro").classList.remove("show"); try { localStorage.setItem(INTRO_KEY(), "1"); } catch(e){} } };
$("mapBtn").onclick = openMap; $("mapReset").onclick = () => { if(confirm("Start the adventure again from the beginning? Your stones and things you found on this device will be cleared.")) resetGame(); }; $("mapX").onclick = () => $("map").classList.remove("show"); $("map").addEventListener("click", e => { if(e.target.id === "map") $("map").classList.remove("show"); });
$("snd").onclick = () => { if(audio.on){ audio.on = false; MUSIC.on = false; if(audio.wind) audio.wind.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.2); $("snd").textContent = "🔇"; } else { startAudio(); MUSIC.on = true; MUSIC.next = 0; $("snd").textContent = "🔊"; } };

/* ============================== HUD and controls ============================== */
const BLOOM = [0.35, 0.35, 0.35];
function regionAt(c, z){ const i = c.regions.findIndex(r => z < r.z1); return i < 0 ? c.regions.length - 1 : i; }
function updateBloom(){ MAIN.regions.forEach((r, i) => { const ns = allNodes().filter(n => n.region === i && n.type === "stone" && !n.optional), c = ns.filter(n => n.done).length; BLOOM[i] = 0.35 + 0.65 * (ns.length ? c / ns.length : 0); }); }
function drawHud(){
  saveGame(); updateBloom();
  const tally = {}, total = {};
  MAIN.steps.forEach(st => (st.fork ? [...st.L, ...st.R] : [st]).forEach(n => { if(!n.s) return; total[n.s] = (total[n.s] || 0) + 1; if(n.done) tally[n.s] = (tally[n.s] || 0) + 1; }));
  $("skills").innerHTML = Object.entries(SKILLS).map(([k, s]) => `<div class="sk" data-s="${k}" style="--c:${s.c}"><i style="background:${s.c}22">${s.i}</i>${s.n}<span class="pips">${Array.from({ length: total[k] || 0 }, (_, j) => `<b class="${j < (tally[k] || 0) ? "on" : ""}"></b>`).join("")}</span></div>`).join("");
  $("powers").innerHTML = (S.powers.length ? "Powers: " + S.powers.map(p => `<span>${POWERS[p]}</span>`).join("") : "") + (S.loot.length ? ` <span>👕 ${S.loot.length} thing${S.loot.length === 1 ? "" : "s"} found</span>` : "");
  if(S.mode === "bonus"){ $("where").innerHTML = `🌟 Starlight Stage<small>Bonus level</small>`; return; }
  const ri = (baseNode() || {}).region || 0, r = REGIONS[ri];
  const cl = clearedIn(ri); $("where").innerHTML = `${r.name}<small>${cl >= r.need ? "✓ Gate boss ready!" : `${cl} of ${r.need} stones for the gate`}</small>`;
}
function bump(s){ requestAnimationFrame(() => { const e = $("skills").querySelector(`[data-s="${s}"]`); if(e){ e.classList.remove("bump"); void e.offsetWidth; e.classList.add("bump"); } }); }
function renderControls(){
  const c = $("controls");
  if(S.choosing){ const f = S.choosing.fork;
    c.innerHTML = ["L", "R"].map(b => `<button class="choice" data-c="${b}">${b === "L" ? "⬅ " : ""}${SKILLS[f.sk[b]].i} ${f.names[b]}${b === "R" ? " ➡" : ""}<small>${SKILLS[f.sk[b]].n} stones</small></button>`).join("");
  } else c.innerHTML = `<button data-c="back" aria-label="Go back" ${S.moving ? "disabled" : ""}>◀</button><button class="go" data-c="go" ${S.moving ? "disabled" : ""}>▶ Walk on</button><button data-c="jump" aria-label="Jump">⤒</button>`;
}
// press and hold "Walk on" to walk on past cleared stones
const AUTO = { on: false, timer: null };
$("controls").addEventListener("pointerdown", e => { if(!e.target.closest('[data-c="go"]')) return; AUTO.timer = setTimeout(() => { AUTO.on = true; toast("Walking on…", "Stopping at the next new stone."); forward(); }, 550); });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => $("controls").addEventListener(ev, () => clearTimeout(AUTO.timer)));
$("controls").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if(!b) return; const k = b.dataset.c;
  if(k === "go") forward(); else if(k === "back") back(); else if(k === "jump") jump(); else choose(k); });
addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("#sheet button")) return;
  if(S.choosing){ if(e.key === "ArrowLeft") choose("L"); if(e.key === "ArrowRight") choose("R"); return; }
  if(e.key === "ArrowUp" || e.key === " " || e.key === "Enter"){ e.preventDefault(); forward(); }
  if(e.key === "ArrowDown"){ e.preventDefault(); back(); }
  if(e.key === "j" || e.key === "J") jump();
  if(e.key === "m" || e.key === "M") openMap();
  if(e.key === "Escape") hideSheet();
});
// drag sideways to look around (it eases back when you let go); a quick tap jumps
const LOOK = { x: 0, drag: null };
cv.addEventListener("pointerdown", e => { LOOK.drag = { x: e.clientX, start: LOOK.x, t: performance.now(), moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if(!LOOK.drag) return; const dx = e.clientX - LOOK.drag.x; if(Math.abs(dx) > 6) LOOK.drag.moved = true; LOOK.x = Math.max(-5, Math.min(5, LOOK.drag.start - dx * 0.02)); });
cv.addEventListener("pointerup", e => { const d = LOOK.drag; LOOK.drag = null; if(!(d && !d.moved && performance.now() - d.t < 300)) return;
  if($("sheet").classList.contains("show")){ hideSheet(); return; }
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, hit = [...HITS].reverse().find(h => x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1);
  if(hit) poke(hit); else jump(); });
// tapping things in the world
const HITS = [];
function poke(h){ const now = performance.now(), o = h.o;
  if(h.kind === "windmill"){ o.spunBase = o.boost || 0; o.poke = now; if(audio.on) tone(180, audio.ctx.currentTime, 0.8, "sine", 0.03, 360); return; }
  o.poke = now;
  if(h.kind === "sheep" && audio.on) baa();
  if(h.kind === "duck" && audio.on){ const t = audio.ctx.currentTime; tone(520, t, 0.12, "square", 0.03, 380); tone(520, t + 0.16, 0.12, "square", 0.03, 380); }
  if(h.kind === "friend"){ o.line = ["Hey! That tickles!", "Woo! High five!", "Let's jam later!", "You found me!", CHEERS[Math.floor(Math.random() * CHEERS.length)]][Math.floor(Math.random() * 5)]; o.said = now; lick(); }
  if(h.kind === "crowd" && audio.on) winSound();
  if(h.kind === "me" && !HERO.turn) turnAround(["wave", "peace", "thumbs", "rock", "flex"][Math.floor(Math.random() * 5)], 1100);
  if(h.kind === "boss" && audio.on) grumble();
  if(h.kind === "secret" && !S.loot.includes(o.secret.loot.n)){ giveLoot(o.secret.loot); toast("✨ Secret found!", `You found ${o.secret.loot.n}! It's in your wardrobe.`); burst(o.x, 0.8, o.z, "#ffc42b", 40); drawHud(); }
  if(h.kind === "stone"){ if(S.choosing) choose(o.branch); else forward(); } }
let toastT; function toast(a, b){ const t = $("toast"); t.innerHTML = a + (b ? `<small>${b}</small>` : ""); t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1900); }
function hint(on){ $("hint").style.opacity = on ? 1 : 0; }

/* ============================== start ============================== */
addEventListener("resize", resize);
resize();
const resumed = loadGame(); heroImages(); setAt(resumed ? baseNode() : C.steps[0]); S.cam.x = S.px; S.cam.z = S.pz - 7;
drawHud(); renderControls();
requestAnimationFrame(frame);
// back from playing a stone's game: open that stone's card and ask how it went
let RETURNED = false; try { RETURNED = resumed && !!localStorage.getItem(PENDING_KEY()); localStorage.removeItem(PENDING_KEY()); } catch(e){}
if(RETURNED) setTimeout(() => { if(!node().done) showSheet(); RETURNED = false; }, 1200);
let seenIntro = false; try { seenIntro = !!localStorage.getItem(INTRO_KEY()); } catch(e){}
if(!resumed && !seenIntro) setTimeout(showIntro, 2600);
else if(!resumed) setTimeout(() => toast(`Off you go${ME.name ? ", " + ME.name : ""}!`, "Walk on to the first stone."), 2800);
setTimeout(() => hint(false), 7000);
// for testing without the animation running (e.g. a hidden browser tab)
window.__adv = { S, MAIN, BONUSC, forward, back, choose, pass, fail, node, enterBonus };
</script>
